<body>it may change at every saturday or sunday 16:30 - 18:00 <br />
    <canvas id="scene" width="800" height="500"></canvas>
    <script>
        document.addEventListener('keydown', function(event) {
            console.log(`Нажата клавиша: ${event.key}, Код: ${event.code}`);
            if (event.code === 'Digit1') {
                drawBackground("#c2c2c2"); 
                drawRobot();
                drawRemote();
            }   
            else if (event.code === 'Digit2') {
                drawBackground("#c2c2c2")
                drawBlock();
                drawKeyboard();
                drawMonitor();
                drawMouse();
            }  
        });

        const canvas = document.getElementById("scene");
        const ctx = canvas.getContext("2d");
        function drawBackground(color) {
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        drawBackground("#c2c2c2");
        function drawText(text, x, y) { 
            ctx.fillStyle = "#321";
            ctx.font = "15px sans-serif"; 
            ctx.fillText(text, x, y);
        }
        function drawRectangle(color, x, y, widht, height){
            ctx.fillStyle = color;
            ctx.fillRect(x, y, widht, height);
        }
        function drawMonitor(){
            // рамка
            drawRectangle("#000000", 20, 100, 180, 110);
            // экран       
            ctx.fillStyle = "#4f4f4f";
            ctx.fillRect(30, 110, 160, 90);
            // ножка
            ctx.fillStyle = "#000000";
            ctx.fillRect(95, 200, 30, 20);
            ctx.fillStyle = "#000000";
            ctx.fillRect(60, 220, 100, 10);
        }
        function drawKeys(keyboardY, keyboardHeight){
            // как я вижу это на питоне 
            //coordinates = [30, 245, 15, 15]
            //while coordinates[0] <= 170
            //      coordinates[0] += 20
            //      while coordinates[1] <= 262
            //          coordinates[1] += 17
            //пока что на новом языке я не знаю как писать циклы но я попытался
            //я заметил что первый пункт повышается на 20 много раз в клавиатуре от 30 прибавляем 20 и так до 170
            //таких цепочек 2: одна где высота 240 другая где 262
            //из хорошего я не использовал i и сделал новую технику с += и <= (прочитал что так можно в интернете)
            
            let color = "#000000"; 
            let keyWidht = 15;
            let keyHeight = 15;
            let keySpace = 2;
            let allKeysHeight = keyHeight * 2 + keySpace; 
            let keyboardSpace = keyboardHeight / 2 - allKeysHeight / 2;
            let y1 = keyboardY + keyboardSpace;
            let y2 = y1 + keyHeight + keySpace;
            for (let y of [y1, y2]) {
                // Внутренний цикл: идет по ширине X от 30 до 170 с шагом 20
                for (let x = 30; x <= 170; x += 20) {  
                    // Используем функцию отрисовки и переменные
                    drawRectangle(color, x, y, keyWidht, keyHeight);       
                }
            }

            //ctx.fillStyle = "#000000";
            //ctx.fillRect(70, 245, 15, 15);
            //ctx.fillRect(90, 245, 15, 15);
            //ctx.fillRect(110, 245, 15, 15);
            //ctx.fillRect(130, 245, 15, 15);
            //ctx.fillRect(150, 245, 15, 15);
            //ctx.fillRect(170, 245, 15, 15);
            //ctx.fillRect(30, 262, 15, 15);
            //ctx.fillRect(50, 262, 15, 15);
            //ctx.fillRect(70, 262, 15, 15);
            //ctx.fillRect(90, 262, 15, 15);
            //ctx.fillRect(110, 262, 15, 15);
            //ctx.fillRect(130, 262, 15, 15);
            //ctx.fillRect(150, 262, 15, 15);
            //ctx.fillRect(170, 262, 15, 15);
        } 
        function drawKeyboard(){
            // клавиатура
            let color = "#808080";
            let x = 25;
            let y = 240;
            let widht = 165;
            let height = 40;
            drawRectangle(color, x, y, widht, height);
            drawKeys(y, height);
            
        }
        function drawMouse(){
            // мышка
            drawRectangle("#808080", 200, 240, 20, 40) 
            ctx.fillStyle = "#000000";
            ctx.fillRect(201, 240, 7, 17);
            ctx.fillStyle = "#000000";
            ctx.fillRect(211, 240, 7, 17);
            ctx.ellipse(209.5, 254, 1, 10, 0, 0, 2 * Math.PI);
            ctx.fill();
        }
        function drawBlock(){
            // блок
            ctx.fillStyle = "#333333";
            ctx.fillRect(30, 290, 100, 200);
            ctx.beginPath();
            ctx.fillStyle = "#000000"
            ctx.arc(80, 340, 40, 0, Math.PI * 2, true);
            ctx.fill();
            ctx.beginPath();
            ctx.fillStyle = "#000000"
            ctx.arc(80, 435, 40, 0, Math.PI * 2, true);
            ctx.fill();
            ctx.fillStyle = "#333333";
            ctx.fillRect(30, 290, 100, 200);
            ctx.beginPath();
            ctx.fillStyle = "#000000"
            ctx.arc(80, 340, 40, 0, Math.PI * 2, true);
            ctx.fill();
            ctx.beginPath();
            ctx.fillStyle = "#000000"
            ctx.arc(80, 435, 40, 0, Math.PI * 2, true);
            ctx.fill();
        }
        drawText("[done] КОМП ПОЛНОСТЬЮ доделать: мышка, клавиатура, системный блок, ножка монитора", 0, 15);

        drawText("[done] весь код в функции (пример функция drawText)", 400, 115);
        drawText("[done] продолжить переписать клавиатуру на цикл если что то непонятно написать о ошибке и закоммитить", 0, 90)
        drawText("[todo] поправить икс клавиатуры", 400, 130);
        drawText("[todo] сделать текст в переменные", 400, 145);
        drawText("[done] убрать человечка, добавить пульт и робота", 400, 260);
        drawText("[goal] ходячие две ноги управляемость с пульта и физическая симуляция", 200, 490);
        drawText("[todo] сделать изменеия размера с помощью функции для робота и пк", 400, 145);
        function drawHuman(){

            ctx.beginPath()

            ctx.fillRect(200, 350, 30,65);
